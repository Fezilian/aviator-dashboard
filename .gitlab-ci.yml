# Publishes the phone page (web/public) to GitLab Pages.
# The data file data/latest.json is pushed by the PC every minute through the API; those commits
# must NOT redeploy the site, so the job only runs when the page itself changes.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - echo "publishing the Aviator page"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - public/**/*
        - .gitlab-ci.yml
